services:
  - type: web
    name: flashback-naija
    runtime: node
    plan: free
    rootDir: THROWBACK
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: flashback-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: flashback-db
    plan: free
